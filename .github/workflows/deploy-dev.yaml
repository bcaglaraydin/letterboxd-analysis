name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "infra/**"
      - "backend/**"
      - "frontend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.5.7
  TERRAGRUNT_VERSION: 0.54.12
  NODE_VERSION: 22

jobs:
  deploy-s3:
    name: Deploy S3
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/s3
    secrets: inherit

  deploy-dynamodb:
    name: Deploy DynamoDB
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/dynamodb/films
      output_key: table_name
    secrets: inherit

  deploy-sqs:
    name: Deploy SQS
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/sqs
      output_key: queue_name
    secrets: inherit

  deploy-lambda-coord:
    name: Deploy Lambda Coord
    needs: [deploy-s3, deploy-dynamodb, deploy-sqs]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda
      install_backend_deps: true
    secrets: inherit

  deploy-lambda-worker:
    name: Deploy Lambda Worker
    needs: [deploy-s3, deploy-dynamodb, deploy-sqs]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-worker
      install_backend_deps: true
    secrets: inherit

  deploy-lambda-metrics:
    name: Deploy Lambda Metrics
    needs: [deploy-s3, deploy-dynamodb, deploy-sqs]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-metrics
      install_backend_deps: true
    secrets: inherit

  deploy-gateway:
    name: Deploy Gateway
    needs: [deploy-lambda-coord, deploy-lambda-worker, deploy-lambda-metrics]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/api-gateway
      output_key: api_endpoint
    secrets: inherit

  deploy-monitoring:
    name: Deploy Monitoring
    needs: deploy-gateway
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/monitoring
    secrets: inherit

  deploy-cloudfront:
    name: Deploy CloudFront
    needs: deploy-gateway
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/cloudfront
    secrets: inherit

  verify-backend:
    name: Verify Backend
    needs: [deploy-sqs, deploy-dynamodb, deploy-gateway]
    uses: ./.github/workflows/verify-dev.yaml
    with:
      api_url: ${{ needs.deploy-gateway.outputs.terragrunt_output }}
      sqs_queue_name: ${{ needs.deploy-sqs.outputs.terragrunt_output }}
      films_table: ${{ needs.deploy-dynamodb.outputs.terragrunt_output }}
    secrets: inherit

  deploy-frontend:
    name: Deploy Frontend
    needs: [deploy-gateway, verify-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-gateway.outputs.terragrunt_output }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        working-directory: frontend/out
        run: |
          aws s3 sync . s3://letterboxd-analysis-frontend-dev --delete
