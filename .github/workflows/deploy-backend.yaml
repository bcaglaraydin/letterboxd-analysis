# ==============================================================================
# DEPLOY BACKEND - SELECTIVE CI/CD
# ==============================================================================
# This workflow implements the selective build/deploy strategy using 
# dorny/paths-filter and native GitHub Actions logic.
# ==============================================================================

name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: 'Force rebuild ALL images'
        type: boolean
        default: false
      target_lambdas:
        description: 'Specific Comma-separated Lambdas to deploy (e.g. status,worker)'
        type: string
        default: ''
  push:
    branches:
      - develop
      - master
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yaml'
      - '.github/filters.yaml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.15.0
  TERRAGRUNT_VERSION: 1.0.3
  NODE_VERSION: 24
  APP_ENV: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}

jobs:
  # ============================================================================
  # DETECT CHANGES 
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # Pass through all filter outputs
      start: ${{ steps.filter.outputs.start }}
      status: ${{ steps.filter.outputs.status }}
      list_scraper: ${{ steps.filter.outputs.list_scraper }}
      worker: ${{ steps.filter.outputs.worker }}
      base_image: ${{ steps.filter.outputs.base_image }}
      core_infra: ${{ steps.filter.outputs.core_infra }}
      ecr_infra: ${{ steps.filter.outputs.ecr_infra }}
      gateway_infra: ${{ steps.filter.outputs.gateway_infra }}
      
      # Computed list for matrix strategy
      affected_lambdas: ${{ steps.compute.outputs.affected_lambdas }}
      has_affected: ${{ steps.compute.outputs.has_affected }}
      base_needs_rebuild: ${{ steps.compute.outputs.base_needs_rebuild }}
      
    steps:
      - uses: actions/checkout@v6
      
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

      - name: Compute Strategy
        id: compute
        run: |
          # Initialize empty array for JSON
          LAMBDAS_JSON="[]"
          HAS_AFFECTED="false"
          BASE_REBUILD="false"
          
          # Check inputs first
          FORCE="${{ github.event.inputs.force_rebuild_all }}"
          TARGETS="${{ github.event.inputs.target_lambdas }}"
          
          # Check filter outputs
          START_CHANGED="${{ steps.filter.outputs.start }}"
          STATUS_CHANGED="${{ steps.filter.outputs.status }}"
          LIST_CHANGED="${{ steps.filter.outputs.list_scraper }}"
          WORKER_CHANGED="${{ steps.filter.outputs.worker }}"
          BASE_CHANGED="${{ steps.filter.outputs.base_image }}"
          
          if [ "$FORCE" == "true" ]; then
             echo "Rebuilding ALL due to force"
             LAMBDAS_JSON='["start","status","list-scraper","worker"]'
             HAS_AFFECTED="true"
             BASE_REBUILD="true" # Rebuild base just in case
          elif [ -n "$TARGETS" ]; then
             echo "Targeting specific lambdas: $TARGETS"
             SAFE_TARGETS=$(echo $TARGETS | tr ',' '\n' | jq -R . | jq -s -c .)
             LAMBDAS_JSON="$SAFE_TARGETS"
             HAS_AFFECTED="true"
          else
             # Build list based on changes
             AFFECTED=()
             
             # Lightweight lambdas (independent of base image changes)
             if [ "$START_CHANGED" == "true" ]; then AFFECTED+=("start"); fi
             if [ "$STATUS_CHANGED" == "true" ]; then AFFECTED+=("status"); fi
             
             # Browser lambdas (depend on Base Image OR their own changes)
             if [ "$LIST_CHANGED" == "true" ] || [ "$BASE_CHANGED" == "true" ]; then 
                AFFECTED+=("list-scraper"); 
             fi
             if [ "$WORKER_CHANGED" == "true" ] || [ "$BASE_CHANGED" == "true" ]; then 
                AFFECTED+=("worker"); 
             fi
             
             if [ "$BASE_CHANGED" == "true" ]; then
                BASE_REBUILD="true"
             fi
             
             if [ ${#AFFECTED[@]} -gt 0 ]; then
               LAMBDAS_JSON=$(printf '%s\n' "${AFFECTED[@]}" | jq -R . | jq -s -c .)
               HAS_AFFECTED="true"
             fi
          fi
          
          echo "affected_lambdas=$LAMBDAS_JSON" >> $GITHUB_OUTPUT
          echo "has_affected=$HAS_AFFECTED" >> $GITHUB_OUTPUT
          echo "base_needs_rebuild=$BASE_REBUILD" >> $GITHUB_OUTPUT
          
          echo "Strategy Computed:"
          echo "Affected: $LAMBDAS_JSON"
          echo "Base Rebuild: $BASE_REBUILD"

  # ============================================================================
  # BUILD BASE IMAGE (If Needed)
  # ============================================================================
  build-base:
    name: Build Base Image
    needs: detect-changes
    if: needs.detect-changes.outputs.base_needs_rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/docker/base/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOY ECR REPOS (If Needed)
  # ============================================================================
  deploy-ecr:
    name: Deploy ECR
    needs: detect-changes
    if: needs.detect-changes.outputs.ecr_infra == 'true'
    permissions:
      id-token: write
      contents: read
    strategy:
       matrix:
         repo: [base, start, status, list-scraper, worker]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/shared/ecr/${{ matrix.repo }}
    secrets: inherit

  # ============================================================================
  # BUILD AFFECTED LAMBDAS
  # ============================================================================
  build:
    name: Build ${{ matrix.lambda }}
    needs: [detect-changes, build-base] # Optional dependency on build-base
    permissions:
      id-token: write
      contents: read
    # Run if we have affected lambdas AND (base build skipped OR succeeded)
    if: |
      always() && 
      needs.detect-changes.outputs.has_affected == 'true' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.affected_lambdas) }}
    uses: ./.github/workflows/build-single-lambda.yaml
    with:
      lambda_name: ${{ matrix.lambda }}
      image_tag: ${{ github.sha }}
    secrets: inherit

  # ============================================================================
  # CORE INFRASTRUCTURE
  # ============================================================================
  deploy-core-infra:
    name: Deploy Core ${{ matrix.component }}
    needs: detect-changes
    if: needs.detect-changes.outputs.core_infra == 'true'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: 
          - dynamodb/films
          - dynamodb/user-jobs
          - dynamodb/quotas
          - dynamodb/global-usage
          - sqs
          - sqs-list
          - cost-protection
          - s3
          - cloudfront
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/${{ matrix.component }}
    secrets: inherit

  # ============================================================================
  # DEPLOY AFFECTED LAMBDAS
  # ============================================================================
  deploy-lambdas:
    name: Deploy ${{ matrix.lambda }}
    needs: [detect-changes, build, deploy-core-infra]
    permissions:
      id-token: write
      contents: read
    # Run only if build succeeded (or was skipped? No, build is mandatory for affected)
    if: always() && needs.build.result == 'success' && (needs.deploy-core-infra.result == 'success' || needs.deploy-core-infra.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.affected_lambdas) }}
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/lambda-container/${{ matrix.lambda }}
      env_vars: |
        IMAGE_TAG=${{ github.sha }}
    secrets: inherit

  # ============================================================================
  # DEPLOY API GATEWAY
  # ============================================================================
  deploy-api-gateway:
    name: Deploy API Gateway
    needs: [detect-changes, deploy-lambdas]
    if: always() && (needs.deploy-lambdas.result == 'success' || needs.detect-changes.outputs.gateway_infra == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/api-gateway
      output_key: api_endpoint
    secrets: inherit

  # ============================================================================
  # DEPLOY MONITORING
  # ============================================================================
  deploy-monitoring:
    name: Deploy Monitoring
    needs: [detect-changes, deploy-api-gateway]
    if: always() && (needs.deploy-api-gateway.result == 'success' || needs.detect-changes.outputs.core_infra == 'true')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/monitoring
    secrets: inherit

  # ============================================================================
  # E2E VERIFICATION
  # ============================================================================
  verify-e2e:
    name: E2E Verification
    needs: [deploy-api-gateway]
    if: needs.deploy-api-gateway.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        working-directory: backend
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "git@github.com:"
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          npm ci
      - name: Get API Endpoint
        run: |
           if [ -n "${{ needs.deploy-api-gateway.outputs.terragrunt_output }}" ]; then
             echo "API_GATEWAY_URL=${{ needs.deploy-api-gateway.outputs.terragrunt_output }}" >> $GITHUB_ENV
           else
             echo "API_GATEWAY_URL=" >> $GITHUB_ENV
           fi
      - name: Run E2E Test
        working-directory: backend
        env:
          API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          ADMIN_IPS: ${{ secrets.ADMIN_IPS }}
          API_GATEWAY_URL: ${{ env.API_GATEWAY_URL }}
          TEST_USERNAME: bcaglaraydin
          E2E_TIMEOUT_SECONDS: '120'
        run: npm run test:e2e
