name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'infra/**'
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.5.7
  TERRAGRUNT_VERSION: 0.54.12

jobs:
  deploy-s3:
    name: Deploy S3
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/s3
    secrets: inherit

  deploy-dynamodb:
    name: Deploy DynamoDB Films
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/dynamodb/films
      output_key: table_name
    secrets: inherit

  deploy-dynamodb-user-jobs:
    name: Deploy DynamoDB UserJobs
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/dynamodb/user-jobs
      output_key: table_name
    secrets: inherit

  deploy-sqs:
    name: Deploy SQS
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/sqs
      output_key: queue_name
    secrets: inherit

  deploy-lambda-deployment-bucket:
    name: Deploy Lambda Deployment Bucket
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-deployment-bucket
    secrets: inherit

  deploy-lambda-coord:
    name: Deploy Lambda Coord
    needs: [deploy-s3, deploy-dynamodb, deploy-sqs, deploy-lambda-deployment-bucket]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda
      install_backend_deps: true
    secrets: inherit

  deploy-lambda-worker:
    name: Deploy Lambda Worker
    needs: [deploy-s3, deploy-dynamodb, deploy-sqs, deploy-lambda-deployment-bucket]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-worker
      install_backend_deps: true
    secrets: inherit

  deploy-lambda-metrics:
    name: Deploy Lambda Metrics
    needs:
      [
        deploy-s3,
        deploy-dynamodb,
        deploy-dynamodb-user-jobs,
        deploy-sqs,
        deploy-lambda-deployment-bucket,
      ]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-metrics
      install_backend_deps: true
    secrets: inherit

  deploy-lambda-status:
    name: Deploy Lambda Status
    needs:
      [
        deploy-s3,
        deploy-dynamodb,
        deploy-dynamodb-user-jobs,
        deploy-sqs,
        deploy-lambda-deployment-bucket,
      ]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-status
      install_backend_deps: true
    secrets: inherit

  deploy-gateway:
    name: Deploy Gateway
    needs: [deploy-lambda-coord, deploy-lambda-worker, deploy-lambda-metrics, deploy-lambda-status]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/api-gateway
      output_key: api_endpoint
    secrets: inherit

  deploy-monitoring:
    name: Deploy Monitoring
    needs: deploy-gateway
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/monitoring
    secrets: inherit

  deploy-cloudfront:
    name: Deploy CloudFront
    needs: deploy-gateway
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/cloudfront
      output_key: cloudfront_id
    secrets: inherit

  verify-backend:
    name: Verify Backend
    needs: [deploy-sqs, deploy-dynamodb, deploy-gateway]
    uses: ./.github/workflows/verify-dev.yaml
    with:
      api_url: ${{ needs.deploy-gateway.outputs.terragrunt_output }}
      sqs_queue_name: ${{ needs.deploy-sqs.outputs.terragrunt_output }}
      films_table: ${{ needs.deploy-dynamodb.outputs.terragrunt_output }}
    secrets: inherit
