# ==============================================================================
# DEPLOY BACKEND - Container-based Lambda Architecture
# ==============================================================================
#
# This workflow deploys the complete backend infrastructure:
#   1. Core infrastructure (DynamoDB, SQS, ECR)
#   2. Build & push Docker images to ECR
#   3. Deploy Lambda containers
#   4. Deploy API Gateway
#   5. E2E verification
#
# Trigger: Push to master (backend/** or infra/**) or manual dispatch
# ==============================================================================

name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      force_rebuild_images:
        description: 'Force rebuild all Docker images'
        type: boolean
        default: false
      skip_e2e:
        description: 'Skip E2E verification'
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yaml'
      - '.github/workflows/build-lambda-images.yaml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false # Don't cancel in-progress deploys

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.5.7
  TERRAGRUNT_VERSION: 0.54.12
  NODE_VERSION: 22

jobs:
  # ============================================================================
  # DETECT CHANGES
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_code: ${{ steps.filter.outputs.backend_code }}
      base_dockerfile: ${{ steps.filter.outputs.base_dockerfile }}
      lambda_dockerfiles: ${{ steps.filter.outputs.lambda_dockerfiles }}
      ecr_infra: ${{ steps.filter.outputs.ecr_infra }}
      lambda_infra: ${{ steps.filter.outputs.lambda_infra }}
      gateway_infra: ${{ steps.filter.outputs.gateway_infra }}
      core_infra: ${{ steps.filter.outputs.core_infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_code:
              - 'backend/src/**'
              - 'backend/package*.json'
            base_dockerfile:
              - 'backend/docker/base/**'
            lambda_dockerfiles:
              - 'backend/docker/lambdas/**'
            ecr_infra:
              - 'infra/envs/dev/ecr/**'
              - 'infra/modules/ecr/**'
            lambda_infra:
              - 'infra/envs/dev/lambda-container/**'
              - 'infra/modules/lambda-container/**'
            gateway_infra:
              - 'infra/envs/dev/api-gateway/**'
              - 'infra/modules/api-gateway/**'
            core_infra:
              - 'infra/envs/dev/dynamodb/**'
              - 'infra/envs/dev/sqs/**'
              - 'infra/envs/dev/sqs-list/**'
              - 'infra/modules/dynamodb/**'
              - 'infra/modules/sqs/**'

  # ============================================================================
  # CORE INFRASTRUCTURE (DynamoDB, SQS)
  # ============================================================================
  deploy-core-infra:
    name: Deploy Core ${{ matrix.component }}
    needs: detect-changes
    if: needs.detect-changes.outputs.core_infra == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        component: 
          - dynamodb/films
          - dynamodb/user-jobs
          - sqs
          - sqs-list
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/${{ matrix.component }}
    secrets: inherit

  # ============================================================================
  # ECR REPOSITORIES
  # ============================================================================
  deploy-ecr:
    name: Deploy ECR ${{ matrix.repo }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ecr_infra == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        repo: [base, start, status, list-scraper, worker]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/ecr/${{ matrix.repo }}
    secrets: inherit

  # ============================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================================================
  build-images:
    name: Build Docker Images
    needs: [detect-changes, deploy-ecr]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.backend_code == 'true' ||
       needs.detect-changes.outputs.base_dockerfile == 'true' ||
       needs.detect-changes.outputs.lambda_dockerfiles == 'true' ||
       github.event.inputs.force_rebuild_images == 'true')
    uses: ./.github/workflows/build-lambda-images.yaml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit

  # ============================================================================
  # DEPLOY LAMBDA CONTAINERS
  # ============================================================================
  deploy-lambda-containers:
    name: Deploy Lambda ${{ matrix.lambda }}
    needs: [detect-changes, deploy-core-infra, build-images]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.backend_code == 'true' ||
       needs.detect-changes.outputs.lambda_infra == 'true' ||
       needs.detect-changes.outputs.lambda_dockerfiles == 'true' ||
       github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        lambda: [start, status, list-scraper, worker]
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/lambda-container/${{ matrix.lambda }}
      env_vars: |
        IMAGE_TAG=${{ github.sha }}
    secrets: inherit

  # ============================================================================
  # DEPLOY API GATEWAY
  # ============================================================================
  deploy-api-gateway:
    name: Deploy API Gateway
    needs: [detect-changes, deploy-lambda-containers]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.gateway_infra == 'true' ||
       needs.detect-changes.outputs.lambda_infra == 'true' ||
       github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/dev/api-gateway
      output_key: api_endpoint
    secrets: inherit

  # ============================================================================
  # E2E VERIFICATION
  # ============================================================================
  verify-e2e:
    name: E2E Verification
    needs: [deploy-api-gateway]
    if: |
      !cancelled() &&
      !failure() &&
      (needs.deploy-api-gateway.result == 'success' || needs.deploy-api-gateway.result == 'skipped') &&
      github.event.inputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Get API Endpoint
        id: api
        run: |
          # Get from previous job output or fetch from AWS
          if [ -n "${{ needs.deploy-api-gateway.outputs.terragrunt_output }}" ]; then
            API_URL="${{ needs.deploy-api-gateway.outputs.terragrunt_output || '' }}"
          else
            API_URL=$(aws apigatewayv2 get-apis --query "Items[?Name=='letterboxd-analysis-api-dev'].ApiEndpoint" --output text)
          fi
          echo "API_GATEWAY_URL=$API_URL" >> $GITHUB_ENV
          echo "API Endpoint: $API_URL"

      - name: Run E2E Test
        working-directory: backend
        env:
          API_GATEWAY_URL: ${{ env.API_GATEWAY_URL }}
          TEST_USERNAME: bcaglaraydin
          E2E_TIMEOUT_SECONDS: '120'
        run: npm run test:e2e

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Deploy Summary
    needs:
      [
        detect-changes,
        deploy-core-infra,
        deploy-ecr,
        build-images,
        deploy-lambda-containers,
        deploy-api-gateway,
        verify-e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Backend Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core Infrastructure | ${{ needs.deploy-core-infra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR Repositories | ${{ needs.deploy-ecr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda Containers | ${{ needs.deploy-lambda-containers.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Gateway | ${{ needs.deploy-api-gateway.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Verification | ${{ needs.verify-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint:** \`${{ needs.deploy-api-gateway.outputs.terragrunt_output }}\`" >> $GITHUB_STEP_SUMMARY
