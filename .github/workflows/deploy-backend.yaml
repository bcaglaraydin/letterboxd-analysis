# ==============================================================================
# DEPLOY BACKEND - SELECTIVE CI/CD (SIMPLIFIED)
# ==============================================================================

name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: 'Force rebuild ALL images'
        type: boolean
        default: false
      target_lambdas:
        description: 'Specific Comma-separated Lambdas to deploy (e.g. status,worker)'
        type: string
        default: ''
  push:
    branches:
      - develop
      - master
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yaml'
      - '.github/filters.yaml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.15.0
  TERRAGRUNT_VERSION: 1.0.3
  NODE_VERSION: 24
  APP_ENV: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}

jobs:
  # ============================================================================
  # DETECT CHANGES 
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      affected_lambdas: ${{ steps.compute.outputs.affected_lambdas }}
      has_affected_lambdas: ${{ steps.compute.outputs.has_affected_lambdas }}
      affected_ecr_repos: ${{ steps.compute.outputs.affected_ecr_repos }}
      has_affected_ecr: ${{ steps.compute.outputs.has_affected_ecr }}
      affected_core_infra: ${{ steps.compute.outputs.affected_core_infra }}
      has_affected_core: ${{ steps.compute.outputs.has_affected_core }}
      base_needs_rebuild: ${{ steps.compute.outputs.base_needs_rebuild }}
      deploy_gateway: ${{ steps.compute.outputs.deploy_gateway }}
      deploy_monitoring: ${{ steps.compute.outputs.deploy_monitoring }}
      
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml
          list-files: json

      - name: Compute Strategy
        id: compute
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          FORCE="${{ github.event.inputs.force_rebuild_all }}"
          TARGETS="${{ github.event.inputs.target_lambdas }}"
          
          # Initialize default values
          LAMBDAS="[]"
          ECR="[]"
          CORE="[]"
          BASE_REBUILD="${{ steps.filter.outputs.base_image }}"
          GATEWAY="${{ steps.filter.outputs.gateway }}"
          MONITORING="${{ steps.filter.outputs.monitoring }}"

          if [ "$FORCE" == "true" ]; then
            LAMBDAS='["start","status","list-scraper","worker"]'
            ECR='["base","start","status","list-scraper","worker"]'
            CORE='["dynamodb/films","dynamodb/user-jobs","dynamodb/quotas","dynamodb/global-usage","sqs","sqs-list","cost-protection","s3","cloudfront"]'
            BASE_REBUILD="true"
            GATEWAY="true"
            MONITORING="true"
          elif [ -n "$TARGETS" ]; then
            LAMBDAS=$(echo "$TARGETS" | tr ',' '\n' | jq -R . | jq -s -c .)
          else
            # Ensure CHANGES is not empty/null before processing
            if [ -n "$CHANGES" ] && [ "$CHANGES" != "null" ]; then
              LAMBDAS=$(echo "$CHANGES" | jq -c '[.[] | select(startswith("lambda:")) | split(":")[1]]')
              ECR=$(echo "$CHANGES" | jq -c '[.[] | select(startswith("ecr:")) | split(":")[1]]')
              CORE=$(echo "$CHANGES" | jq -c '[.[] | select(startswith("infra:")) | split(":")[1]]')
            fi
          fi

          # Final safety check for empty results
          [ -z "$LAMBDAS" ] && LAMBDAS="[]"
          [ -z "$ECR" ] && ECR="[]"
          [ -z "$CORE" ] && CORE="[]"

          # Outputs for Matrix
          echo "affected_lambdas=$LAMBDAS" >> $GITHUB_OUTPUT
          echo "affected_ecr_repos=$ECR" >> $GITHUB_OUTPUT
          echo "affected_core_infra=$CORE" >> $GITHUB_OUTPUT
          
          # Boolean Helpers
          if [ "$LAMBDAS" != "[]" ]; then echo "has_affected_lambdas=true" >> $GITHUB_OUTPUT; else echo "has_affected_lambdas=false" >> $GITHUB_OUTPUT; fi
          if [ "$ECR" != "[]" ]; then echo "has_affected_ecr=true" >> $GITHUB_OUTPUT; else echo "has_affected_ecr=false" >> $GITHUB_OUTPUT; fi
          if [ "$CORE" != "[]" ]; then echo "has_affected_core=true" >> $GITHUB_OUTPUT; else echo "has_affected_core=false" >> $GITHUB_OUTPUT; fi
          
          echo "base_needs_rebuild=${BASE_REBUILD:-false}" >> $GITHUB_OUTPUT
          echo "deploy_gateway=${GATEWAY:-false}" >> $GITHUB_OUTPUT
          echo "deploy_monitoring=${MONITORING:-false}" >> $GITHUB_OUTPUT

          echo "Strategy Computed:"
          echo "Lambdas: $LAMBDAS"
          echo "ECR: $ECR"
          echo "Core: $CORE"
          echo "Gateway: $GATEWAY, Monitoring: $MONITORING"

  # ============================================================================
  # BUILD BASE IMAGE
  # ============================================================================
  build-base:
    name: Build Base Image
    needs: detect-changes
    if: needs.detect-changes.outputs.base_needs_rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/docker/base/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOY ECR REPOS
  # ============================================================================
  deploy-ecr:
    name: Deploy ECR ${{ matrix.repo }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_affected_ecr == 'true'
    strategy:
       matrix:
         repo: ${{ fromJson(needs.detect-changes.outputs.affected_ecr_repos) }}
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/shared/ecr/${{ matrix.repo }}
    secrets: inherit

  # ============================================================================
  # BUILD LAMBDAS
  # ============================================================================
  build:
    name: Build ${{ matrix.lambda }}
    needs: [detect-changes, build-base]
    if: |
      always() && 
      needs.detect-changes.outputs.has_affected_lambdas == 'true' &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.affected_lambdas) }}
    uses: ./.github/workflows/build-single-lambda.yaml
    with:
      lambda_name: ${{ matrix.lambda }}
      image_tag: ${{ github.sha }}
    secrets: inherit

  # ============================================================================
  # CORE INFRASTRUCTURE
  # ============================================================================
  deploy-core-infra:
    name: Deploy Core ${{ matrix.component }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_affected_core == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect-changes.outputs.affected_core_infra) }}
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/${{ matrix.component }}
    secrets: inherit

  # ============================================================================
  # DEPLOY LAMBDAS
  # ============================================================================
  deploy-lambdas:
    name: Deploy ${{ matrix.lambda }}
    needs: [detect-changes, build, deploy-core-infra]
    if: always() && needs.build.result == 'success' && (needs.deploy-core-infra.result == 'success' || needs.deploy-core-infra.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJson(needs.detect-changes.outputs.affected_lambdas) }}
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/lambda-container/${{ matrix.lambda }}
      env_vars: |
        IMAGE_TAG=${{ github.sha }}
    secrets: inherit

  # ============================================================================
  # DEPLOY API GATEWAY
  # ============================================================================
  deploy-api-gateway:
    name: Deploy API Gateway
    needs: [detect-changes, deploy-lambdas]
    if: |
      always() && 
      (needs.detect-changes.outputs.deploy_gateway == 'true' || github.event.inputs.force_rebuild_all == 'true')
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/api-gateway
      output_key: api_endpoint
    secrets: inherit

  # ============================================================================
  # DEPLOY MONITORING
  # ============================================================================
  deploy-monitoring:
    name: Deploy Monitoring
    needs: [detect-changes, deploy-api-gateway]
    if: |
      always() && 
      (needs.detect-changes.outputs.deploy_monitoring == 'true' || github.event.inputs.force_rebuild_all == 'true')
    uses: ./.github/workflows/terragrunt-apply.yaml
    with:
      working_directory: infra/envs/${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}/monitoring
    secrets: inherit

  # ============================================================================
  # E2E VERIFICATION
  # ============================================================================
  verify-e2e:
    name: E2E Verification
    needs: [deploy-api-gateway]
    if: needs.deploy-api-gateway.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        working-directory: backend
        run: npm ci
      - name: Run E2E Test
        working-directory: backend
        env:
          API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          ADMIN_IPS: ${{ secrets.ADMIN_IPS }}
          API_GATEWAY_URL: ${{ needs.deploy-api-gateway.outputs.terragrunt_output }}
          TEST_USERNAME: bcaglaraydin
          E2E_TIMEOUT_SECONDS: '120'
        run: npm run test:e2e
