name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: 24

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    env:
      APP_ENV: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Infrastructure Outputs
        id: infra
        run: |
          # Fetch API Gateway URL
          API_URL=$(aws apigatewayv2 get-apis --query "Items[?Name=='letterboxd-analysis-api-${APP_ENV}'].ApiEndpoint" --output text)
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT

          # Fetch CloudFront Distribution ID
          # Origin domain matches the S3 bucket regional domain
          CF_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='letterboxd-analysis-frontend-${APP_ENV}.s3.eu-west-1.amazonaws.com'].Id" --output text)
          echo "CF_ID=$CF_ID" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.infra.outputs.API_URL }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GTM_AUTH: ${{ vars.NEXT_PUBLIC_GTM_AUTH }}
          NEXT_PUBLIC_GTM_PREVIEW: ${{ vars.NEXT_PUBLIC_GTM_PREVIEW }}
        run: npm run build

      - name: Sync to S3
        working-directory: frontend/out
        run: |
          aws s3 sync . s3://letterboxd-analysis-frontend-${APP_ENV} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.infra.outputs.CF_ID }} --paths "/*" --no-cli-pager
