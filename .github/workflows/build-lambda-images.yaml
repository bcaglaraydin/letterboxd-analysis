# ==============================================================================
# BUILD LAMBDA CONTAINER IMAGES
# ==============================================================================
# This workflow builds and pushes Docker images for Lambda functions to ECR.
# It is triggered on pushes to master branch when backend code changes,
# or can be triggered manually.
#
# Build order:
# 1. Base image (shared by all Lambdas)
# 2. Lambda images (in parallel matrix)
# ==============================================================================

name: Build Lambda Container Images

on:
  workflow_call: # Called by deploy-backend workflow
    inputs:
      image_tag:
        description: 'Image tag to use'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (defaults to git SHA)'
        required: false
        type: string

env:
  AWS_REGION: eu-west-1

jobs:
  # ============================================================================
  # BUILD BASE IMAGE
  # ============================================================================
  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      base_image_uri: ${{ steps.build.outputs.image_uri }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/docker/base/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base-dev:${{ steps.vars.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-base-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        run: |
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/letterboxd-base-dev:${{ steps.vars.outputs.image_tag }}" >> $GITHUB_OUTPUT

  # ============================================================================
  # BUILD LIGHTWEIGHT LAMBDA IMAGES (No Chromium needed)
  # ============================================================================
  build-lightweight-lambdas:
    name: Build Lambda - ${{ matrix.lambda }}
    needs: build-base  # Only for image_tag output
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        lambda:
          - start
          - status
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/docker/lambdas/${{ matrix.lambda }}/Dockerfile
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-${{ matrix.lambda }}-dev:${{ needs.build-base.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-${{ matrix.lambda }}-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # BUILD BROWSER LAMBDA IMAGES (Chromium base required)
  # ============================================================================
  build-browser-lambdas:
    name: Build Lambda - ${{ matrix.lambda }}
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        lambda:
          - list-scraper
          - worker
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/docker/lambdas/${{ matrix.lambda }}/Dockerfile
          build-args: |
            BASE_IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/letterboxd-base-dev:${{ needs.build-base.outputs.image_tag }}
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-${{ matrix.lambda }}-dev:${{ needs.build-base.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-${{ matrix.lambda }}-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Build Summary
    needs: [build-base, build-lightweight-lambdas, build-browser-lambdas]
    runs-on: ubuntu-latest
    steps:
      - name: Print image tags
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.build-base.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built" >> $GITHUB_STEP_SUMMARY
          echo "- letterboxd-base-dev" >> $GITHUB_STEP_SUMMARY
          echo "#### Lightweight (Node.js 22 base)" >> $GITHUB_STEP_SUMMARY
          echo "- letterboxd-start-dev" >> $GITHUB_STEP_SUMMARY
          echo "- letterboxd-status-dev" >> $GITHUB_STEP_SUMMARY
          echo "#### Browser (Chromium base)" >> $GITHUB_STEP_SUMMARY
          echo "- letterboxd-list-scraper-dev" >> $GITHUB_STEP_SUMMARY
          echo "- letterboxd-worker-dev" >> $GITHUB_STEP_SUMMARY
