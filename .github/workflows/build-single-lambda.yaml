name: Build Single Lambda

on:
  workflow_call:
    inputs:
      lambda_name:
        required: true
        type: string
        description: 'Name of the Lambda to build (e.g., status, worker)'
      image_tag:
        required: true
        type: string
        description: 'Tag for the Docker image'

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    name: Build ${{ inputs.lambda_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine Dockerfile Path
        id: config
        run: |
          LAMBDA="${{ inputs.lambda_name }}"        
          DOCKERFILE="backend/docker/lambdas/${LAMBDA}/Dockerfile"
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "Building $LAMBDA from $DOCKERFILE"

      - name: Build and push Lambda image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: linux/arm64
          provenance: false
          push: true
          # Base image might be needed as build-arg for browser lambdas
          build-args: |
             BASE_IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/letterboxd-base-dev:latest
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-${{ inputs.lambda_name }}-dev:${{ inputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/letterboxd-${{ inputs.lambda_name }}-dev:latest
          cache-from: type=gha,scope=${{ inputs.lambda_name }}
          cache-to: type=gha,scope=${{ inputs.lambda_name }},mode=max
