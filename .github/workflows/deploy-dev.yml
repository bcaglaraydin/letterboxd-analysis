name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.5.7
  TERRAGRUNT_VERSION: 0.54.12
  NODE_VERSION: 22

jobs:
  infra-base:
    name: Deploy Base Infra
    runs-on: ubuntu-22.04
    outputs:
      sqs_queue_url: ${{ steps.sqs.outputs.url }}
      films_table: ${{ steps.dynamodb.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      
      - name: Deploy S3
        working-directory: infra/envs/dev/s3
        run: terragrunt apply -auto-approve
      
      - name: Deploy DynamoDB
        working-directory: infra/envs/dev/dynamodb/films
        run: terragrunt apply -auto-approve
      - name: Get DynamoDB Output
        id: dynamodb
        working-directory: infra/envs/dev/dynamodb/films
        run: echo "name=$(terragrunt output -raw table_name)" >> $GITHUB_OUTPUT

      - name: Deploy SQS
        working-directory: infra/envs/dev/sqs
        run: terragrunt apply -auto-approve
      - name: Get SQS Output
        id: sqs
        working-directory: infra/envs/dev/sqs
        run: echo "url=$(terragrunt output -raw queue_url)" >> $GITHUB_OUTPUT

  infra-compute:
    name: Deploy Compute
    needs: infra-base
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci
      
      - name: Deploy Coordinator Lambda
        working-directory: infra/envs/dev/lambda
        run: terragrunt apply -auto-approve
      - name: Deploy Worker Lambda
        working-directory: infra/envs/dev/lambda-worker
        run: terragrunt apply -auto-approve
      - name: Deploy Metrics Lambda
        working-directory: infra/envs/dev/lambda-metrics
        run: terragrunt apply -auto-approve

  infra-gateway:
    name: Deploy Gateway
    needs: infra-compute
    runs-on: ubuntu-22.04
    outputs:
      api_endpoint: ${{ steps.api.outputs.endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      
      - name: Deploy API Gateway
        working-directory: infra/envs/dev/api-gateway
        run: terragrunt apply -auto-approve
      - name: Get API Output
        id: api
        working-directory: infra/envs/dev/api-gateway
        run: echo "endpoint=$(terragrunt output -raw api_endpoint)" >> $GITHUB_OUTPUT

  infra-final:
    name: Deploy Final
    needs: infra-gateway
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
      
      - name: Deploy Monitoring
        working-directory: infra/envs/dev/monitoring
        run: terragrunt apply -auto-approve
      - name: Deploy CloudFront
        working-directory: infra/envs/dev/cloudfront
        run: terragrunt apply -auto-approve

  verify-backend:
    name: Verify Backend
    needs: [infra-base, infra-gateway]
    uses: ./.github/workflows/verify-dev.yml
    with:
      api_url: ${{ needs.infra-gateway.outputs.api_endpoint }}
      sqs_queue_url: ${{ needs.infra-base.outputs.sqs_queue_url }}
      films_table: ${{ needs.infra-base.outputs.films_table }}
    secrets: inherit

  deploy-frontend:
    name: Deploy Frontend
    needs: [infra-gateway, verify-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.infra-gateway.outputs.api_endpoint }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        working-directory: frontend/out
        run: |
          aws s3 sync . s3://letterboxd-analysis-frontend-dev --delete
