name: Terragrunt Apply

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      output_key:
        required: false
        type: string

      env_vars:
        description: 'Environment variables to set (KEY=VALUE format, one per line)'
        required: false
        type: string
        default: ''
    outputs:
      terragrunt_output:
        description: 'The value of the requested output key'
        value: ${{ jobs.apply.outputs.terragrunt_output }}

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.15.0
  TERRAGRUNT_VERSION: 1.0.3

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    outputs:
      terragrunt_output: ${{ steps.output.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set Environment Variables
        if: ${{ inputs.env_vars != '' }}
        run: |
          echo "${{ inputs.env_vars }}" >> $GITHUB_ENV

      - name: Terragrunt Apply
        uses: gruntwork-io/terragrunt-action@v3
        env:
          API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          ADMIN_IPS: ${{ secrets.ADMIN_IPS }}
        with:
          tf_path: terraform
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: ${{ inputs.working_directory }}
          tg_command: 'apply'

      - name: Get Output
        id: output
        if: ${{ inputs.output_key != '' }}
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tf_path: terraform
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: ${{ inputs.working_directory }}
          tg_command: 'output -raw ${{ inputs.output_key }}'
          tg_add_approve: 0
          tg_output_capture: 1
      
      - name: Set Output
        if: ${{ inputs.output_key != '' }}
        run: |
          echo "value=${{ steps.output.outputs.tg_action_output }}" >> $GITHUB_OUTPUT
