name: Verify Dev Backend

on:
  workflow_call:
    inputs:
      api_url:
        required: false
        type: string
      sqs_queue_name:
        required: false
        type: string
      films_table:
        required: false
        type: string
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.5.7
  TERRAGRUNT_VERSION: 0.54.12
  NODE_VERSION: 22

jobs:
  verify-backend:
    name: Verify Backend Health
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: ${{ inputs.api_url == '' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        if: ${{ inputs.api_url == '' }}
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Fetch Infrastructure Outputs
        id: infra
        run: |
          if [ -n "${{ inputs.api_url }}" ]; then
            echo "Using inputs..."
            echo "API_URL=${{ inputs.api_url }}" >> $GITHUB_ENV
            
            # Construct SQS URL from name
            QUEUE_URL="https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/${{ inputs.sqs_queue_name }}"
            echo "SQS_QUEUE_URL=$QUEUE_URL" >> $GITHUB_ENV
            
            echo "FILMS_TABLE=${{ inputs.films_table }}" >> $GITHUB_ENV
          else
            echo "Fetching from Terragrunt..."
            # API Endpoint
            cd infra/envs/dev/api-gateway
            API_URL=$(terragrunt output -raw api_endpoint)
            echo "API_URL=$API_URL" >> $GITHUB_ENV
            
            # SQS Queue URL
            cd ../sqs
            SQS_QUEUE_URL=$(terragrunt output -raw queue_url)
            echo "SQS_QUEUE_URL=$SQS_QUEUE_URL" >> $GITHUB_ENV
            
            # DynamoDB Table Name
            cd ../dynamodb/films
            FILMS_TABLE=$(terragrunt output -raw table_name)
            echo "FILMS_TABLE=$FILMS_TABLE" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Unit Tests
        working-directory: backend
        run: npm run test:unit

      - name: Run Integration Tests
        working-directory: backend
        env:
          API_URL: ${{ env.API_URL }}
          SQS_QUEUE_URL: ${{ env.SQS_QUEUE_URL }}
          FILMS_TABLE: ${{ env.FILMS_TABLE }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: npm run test:integration
