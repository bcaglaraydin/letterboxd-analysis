# ==============================================================================
# VERIFY DEV BACKEND
# ==============================================================================
# Verifies the deployed backend is healthy by running Vitest-based tests:
#   1. Unit tests (fast, mocked)
#   2. Integration tests (AWS services)
#   3. E2E tests (full API Gateway flow)
#
# Can be called from deploy-backend workflow or run standalone.
# ==============================================================================

name: Verify Dev Backend

on:
  workflow_call:
    inputs:
      api_url:
        required: false
        type: string
        description: 'API Gateway URL (fetched from AWS if not provided)'
  workflow_dispatch:
    inputs:
      api_url:
        required: false
        type: string
        description: 'API Gateway URL (fetched from AWS if not provided)'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: 22

jobs:
  verify-backend:
    name: Verify Backend Health
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            AUTH_HEADER=$(echo -n "x-access-token:$GH_PAT" | base64 | tr -d '\n')
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://github.com/".insteadOf "git@github.com:"
          fi
          npm ci

      # ========================================================================
      # UNIT TESTS (Fast, No AWS)
      # ========================================================================
      - name: Run Unit Tests
        working-directory: backend
        run: npm run test:unit

      - name: Install Playwright Browsers
        working-directory: backend
        run: npx playwright install chromium

      # ========================================================================
      # INTEGRATION TESTS (AWS Services)
      # ========================================================================
      - name: Run Integration Tests
        working-directory: backend
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          FILMS_TABLE: Films
          USER_JOBS_TABLE: UserJobs
          SQS_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/film-scrape-queue
          SQS_LIST_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/list-scrape-queue
          TEST_USERNAME: bcaglaraydin
        run: npm run test:integration

      # ========================================================================
      # E2E TESTS (Full API Gateway Flow)
      # ========================================================================
      - name: Get API Gateway URL
        id: api
        run: |
          if [ -n "${{ inputs.api_url }}" ]; then
            echo "API_GATEWAY_URL=${{ inputs.api_url }}" >> $GITHUB_ENV
          else
            API_URL=$(aws apigatewayv2 get-apis --query "Items[?Name=='letterboxd-analysis-api-dev'].ApiEndpoint" --output text)
            echo "API_GATEWAY_URL=$API_URL" >> $GITHUB_ENV
          fi
          echo "API Endpoint: $API_GATEWAY_URL"

      - name: Run E2E Tests
        working-directory: backend
        env:
          API_GATEWAY_URL: ${{ env.API_GATEWAY_URL }}
          TEST_USERNAME: bcaglaraydin
          E2E_TIMEOUT_SECONDS: '120'
        run: npm run test:e2e
