# ==============================================================================
# CHANGE DETECTION FILTERS
# ==============================================================================
# Maps file changes to specific outcomes.
# Used by deploy-backend.yaml to determine what to build/deploy.
# ==============================================================================

# SHARED CHANGES
core_infra:
  - 'infra/envs/**/dynamodb/**'
  - 'infra/envs/**/sqs/**'
  - 'infra/envs/**/sqs-list/**'
  - 'infra/modules/dynamodb/**'
  - 'infra/modules/sqs/**'
  - 'infra/envs/**/cost-protection/**'
  - 'infra/modules/cost-protection/**'
  - 'infra/envs/**/s3/**'
  - 'infra/modules/s3/**'
  - 'infra/envs/**/cloudfront/**'
  - 'infra/modules/cloudfront/**'
  - 'infra/envs/**/monitoring/**'
  - 'infra/modules/monitoring/**'

ecr_infra:
  - 'infra/shared/ecr/**'
  - 'infra/modules/ecr/**'

gateway_infra:
  - 'infra/envs/**/api-gateway/**'
  - 'infra/modules/api-gateway/**'

# Base image (Chromium) - ONLY affects browser-based lambdas
base_image:
  - 'backend/docker/base/Dockerfile'

# LAMBDA SPECIFIC CHANGES (Trigger specific build/deploy)
# Note: package.json/lock changes trigger ALL because dependencies are copied into all images

start:
  - 'backend/src/handlers/startAnalysisHandler.js'
  - 'backend/src/handlers/authHandler.js'
  - 'backend/src/handlers/apiRouterHandler.js'
  - 'backend/src/services/configService.js'
  - 'backend/src/services/quotaService.js'
  - 'backend/src/services/sqsQueueService.js'
  - 'backend/src/services/userJobService.js'
  - 'backend/src/services/dynamoDbService.js'
  - 'backend/src/services/gameService.js'
  - 'backend/src/services/statsService.js'
  - 'backend/src/services/tmdbService.js'
  - 'backend/src/games/**'
  - 'backend/src/utils/**'
  - 'backend/docker/lambdas/start/**'
  - 'infra/envs/**/lambda-container/start/**'
  - 'backend/package.json'
  - 'backend/package-lock.json'

status:
  - 'backend/src/handlers/getAnalysisStatusHandler.js'
  - 'backend/src/services/dynamoDbService.js'
  - 'backend/src/services/userJobService.js'
  - 'backend/src/services/gameService.js'
  - 'backend/src/services/statsService.js'
  - 'backend/src/services/tmdbService.js'
  - 'backend/src/services/tasteMatchService.js'
  - 'backend/src/games/**'
  - 'backend/src/utils/**'
  - 'backend/docker/lambdas/status/**'
  - 'infra/envs/**/lambda-container/status/**'
  - 'backend/package.json'
  - 'backend/package-lock.json'

list_scraper:
  - 'backend/src/handlers/listScraperHandler.js'
  - 'backend/src/services/letterboxdScrapingService.js'
  - 'backend/src/services/tasteMatchService.js'
  - 'backend/src/services/sqsQueueService.js'
  - 'backend/src/services/userJobService.js'
  - 'backend/src/services/dynamoDbService.js'
  - 'backend/src/utils/**'
  - 'backend/docker/lambdas/list-scraper/**'
  - 'infra/envs/**/lambda-container/list-scraper/**'
  - 'backend/package.json'
  - 'backend/package-lock.json'

worker:
  - 'backend/src/handlers/filmScraperWorker.js'
  - 'backend/src/services/letterboxdScrapingService.js'
  - 'backend/src/services/dynamoDbService.js'
  - 'backend/src/utils/**'
  - 'backend/docker/lambdas/worker/**'
  - 'infra/envs/**/lambda-container/worker/**'
  - 'backend/package.json'
  - 'backend/package-lock.json'
